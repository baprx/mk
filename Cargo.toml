[package]
name = "mk"
version = "0.7.2"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.49", features = [
  "derive",
  "help",
  "usage",
  "error-context",
] }
clap_complete = "4.5.59"
colored = "3.0.0"
dialoguer = "0.12.0"
etcetera = "0.11.0"
ignore = "0.4.23"
regex = "1.12.1"
attohttpc = { version = "0.31.0", features = ["json", "tls-vendored"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.0.0"
toml_edit = "0.25.0"
yaml-rust2 = "0.11.0"
indicatif = "0.18.0"

[dev-dependencies]
# Parametrized testing
rstest = "=0.26.1"

# CLI testing
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

# Temporary directories for tests
tempfile = "=3.27.0"

# Test serialization
serial_test = "=3.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
